# Сборка: бинарник Linux, exe Windows, десктоп-версии, пакет Python (wheel), Flatpak и образ Docker.
# - push в master/main и pull request — сборка и проверка, артефакты в разделе Actions;
# - тег v* (например v2026.10.5) — то же плюс GitHub Release с файлами и образ в ghcr.io/<владелец>/fo76db;
# - вручную: Actions → build → Run workflow.
name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Новый push в ту же ветку/PR отменяет устаревший прогон; сборки по тегам не отменяются (иначе пропадёт релиз).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.14"
  PYTHONUTF8: "1"   # Windows: UTF-8 вместо cp1252 для вывода и open() во всех скриптах (иначе UnicodeEncodeError на кириллице)

jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Сборка wheel и sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Проверка установки
        run: |
          python -m pip install dist/*.whl
          fo76db --version
          python -c "import fo76db.web.app"
      - uses: actions/upload-artifact@v7
        with:
          name: fo76db-python
          path: dist/*

  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04      # старый glibc — бинарник запустится и на дистрибутивах постарше
            name: fo76db-linux-x86_64
            file: dist/fo76db
          - os: windows-latest
            name: fo76db-windows-x86_64.exe
            file: dist/fo76db.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Зависимости
        run: python -m pip install --upgrade pip && python -m pip install ".[build]"
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/fo76db.spec
      - name: Проверка запуска
        shell: bash
        env:
          FO76DB_HOME: ${{ runner.temp }}/fo76db-home
        run: |
          ${{ matrix.file }} --version
          ${{ matrix.file }} serve --port 7699 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7699/home > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:7699/home > /dev/null
          curl -sf http://127.0.0.1:7699/static/app.js > /dev/null
          kill %1 || true
      - name: Имя файла и лицензии сторонних компонентов
        shell: bash
        run: |
          mv "${{ matrix.file }}" "dist/${{ matrix.name }}"
          python packaging/third_party.py "dist/THIRD_PARTY_LICENSES-${{ runner.os }}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.name }}
            dist/THIRD_PARTY_LICENSES-${{ runner.os }}.txt

  desktop:
    # Десктоп-версия (окно pywebview): Linux — Qt WebEngine (папка, архив tar.gz), Windows — Edge WebView2 (один exe без консоли)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: fo76db-desktop-linux-x86_64.tar.gz
          - os: windows-latest
            name: fo76db-desktop-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Зависимости
        run: python -m pip install --upgrade pip && python -m pip install ".[desktop,build]"
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/fo76db-desktop.spec
      - name: Проверка и упаковка
        shell: bash
        env:
          FO76DB_HOME: ${{ runner.temp }}/fo76db-home
        run: |
          python packaging/third_party.py "dist/THIRD_PARTY_LICENSES-desktop-${{ runner.os }}.txt" desktop
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/fo76db-desktop.exe --version   # окно без консоли: проверяется код выхода
            mv dist/fo76db-desktop.exe "dist/${{ matrix.name }}"
          else
            ./dist/fo76db-desktop/fo76db-desktop --version
            cp packaging/desktop/install-linux.sh dist/fo76db-desktop/
            tar -C dist -czf "dist/${{ matrix.name }}" fo76db-desktop
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          compression-level: 0
          path: |
            dist/${{ matrix.name }}
            dist/THIRD_PARTY_LICENSES-desktop-${{ runner.os }}.txt

  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: fo76db-linux-x86_64.flatpak   # артефакт: fo76db-linux-x86_64.flatpak-x86_64
          manifest-path: packaging/flatpak/io.github.leanid3.fo76db.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/**') }}
          # откуда установщик берёт среду; flathub.org (по умолчанию) бывает недоступен, dl.flathub.org — тот же файл с CDN
          runtime-repo: https://dl.flathub.org/repo/flathub.flatpakrepo

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fo76db
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,format=short
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false   # не выкладывать отчёт сборки артефактом (он ломал задачу release)
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Тот же образ файлом: артефакт запуска и вложение релиза. Слои берутся из кэша первой сборки.
      # Загрузка без registry: gunzip -c fo76db-docker-image.tar.gz | docker load
      - name: Образ файлом (docker save)
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          tags: fo76db:latest,fo76db:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/fo76db-docker-image.tar
          cache-from: type=gha
      - run: gzip -9 "${{ runner.temp }}/fo76db-docker-image.tar"
      - uses: actions/upload-artifact@v7
        with:
          name: fo76db-docker-image.tar.gz
          path: ${{ runner.temp }}/fo76db-docker-image.tar.gz
          compression-level: 0   # уже сжат
      - name: Сводка
        run: |
          {
            echo "### Образ Docker"
            if [ "${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}" = "true" ]; then
              echo "Опубликован в registry:"
              echo '```'
              echo "${{ steps.meta.outputs.tags }}" | sed 's/^/docker pull /'
              echo '```'
            else
              echo "В registry не публиковался (pull request)."
            fi
            echo "Файлом: артефакт \`fo76db-docker-image.tar.gz\` → \`gunzip -c fo76db-docker-image.tar.gz | docker load\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel, binary, desktop, flatpak, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4   # LICENSE и CREDITS.md — вложения релиза
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # только наши файлы: build-push-action кладёт в артефакты ещё отчёт сборки *.dockerbuild,
          # и download-artifact падает на нём («Unable to download and extract artifact»)
          pattern: fo76db-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
            LICENSE
            CREDITS.md
          generate_release_notes: true
