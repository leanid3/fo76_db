[build-system]
requires = ["setuptools>=77"]  # license = выражение SPDX (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "fo76db"
dynamic = ["version"]
description = "База предметов, инвентаря и событий Fallout 76: каталог, история обновлений, инвентарь всех персонажей, роллы, события"
readme = "README.md"
# GNU AGPL v3 или новее — см. LICENSE
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "CREDITS.md"]
authors = [{ name = "leanid3" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "tzdata",  # часовые пояса (America/New_York) там, где нет системной базы: Windows, тонкие образы
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]
dev = ["pytest>=8", "httpx2", "ruff"]  # тесты и линтер: pip install -e ".[dev]"; pytest; ruff check
# Десктоп-версия (fo76db desktop): окно pywebview. Linux — Qt (PySide6, LGPL), Windows — Edge WebView2 через pythonnet.
desktop = [
    "pywebview>=6",
    "QtPy>=2.4; sys_platform == 'linux'",
    "PySide6>=6.8; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/leanid3/fo76_db"
Documentation = "https://leanid3.github.io/fo76_db/"

[project.scripts]
fo76db = "fo76db.cli:main"

[tool.setuptools.dynamic]
version = { attr = "fo76db.__version__" }

[tool.setuptools.packages.find]
include = ["fo76db*"]

[tool.setuptools.package-data]
"fo76db.web" = ["static/*", "static/icons/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 160

[tool.ruff.lint]
# только настоящие ошибки (F — pyflakes, E9 — синтаксис, B — подводные камни); стиль кода проект не навязывает
select = ["F", "E9", "B"]
ignore = ["B904", "B008", "B905", "B007"]  # raise ... from; Body(...) — идиома FastAPI; zip strict и неиспользуемая переменная цикла — шум
